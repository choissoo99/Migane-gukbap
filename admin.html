<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>미가네 관리자</title><style>body{font-family:system-ui;background:#fffaf0;margin:0;color:#241d16}.wrap{max-width:720px;margin:auto;padding:24px}.card{background:#fff;border:1px solid #eadfce;border-radius:20px;padding:18px;margin-bottom:14px}input,button{box-sizing:border-box;width:100%;padding:13px;margin:6px 0;border:1px solid #ddd;border-radius:12px;font-size:16px}button{background:#f5c542;font-weight:900;border:0}.muted{color:#777}.hidden{display:none}.row{display:grid;grid-template-columns:1fr 120px;gap:8px}.thumb{width:100%;height:150px;object-fit:cover;border-radius:14px;margin:8px 0}</style></head><body><div class="wrap"><h1>미가네 국밥 관리자</h1><div id="login" class="card"><h2>관리자 로그인</h2><input id="email" type="email" placeholder="이메일"><input id="password" type="password" placeholder="비밀번호"><button onclick="signIn()">로그인</button><p id="msg" class="muted">관리자 계정으로 로그인하세요.</p></div><div id="panel" class="hidden"><button onclick="signOut()">로그아웃</button><h2>공지사항</h2><div class="card"><input id="noticeTitle" placeholder="공지 제목"><input id="noticeBody" placeholder="공지 내용"><button onclick="saveNotice()">공지 등록</button><div id="notices"></div></div><h2>메뉴 관리</h2><div class="card"><h3>새 메뉴 추가</h3><div class="row"><input id="newMenuName" placeholder="메뉴명"><input id="newMenuPrice" type="number" placeholder="가격"></div><button onclick="addMenu()">메뉴 추가</button></div><div id="menus"></div><h2>갤러리 관리</h2><div class="card"><input id="galleryFile" type="file" accept="image/jpeg,image/png,image/webp"><input id="galleryAlt" placeholder="사진 설명 (예: 매장 내부)"><button onclick="addGallery()">갤러리 사진 추가</button><div id="galleryAdmin"></div></div><h2>매장 정보</h2><div id="store" class="card"></div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const sb=supabase.createClient('https://dtpynrwuobgwqdrnmtvl.supabase.co','sb_publishable_MzC5d4lPPEeUs9NHPKK0tw_4sGcsbQY');async function signIn(){const{error}=await sb.auth.signInWithPassword({email:email.value,password:password.value});if(error){msg.textContent='로그인 정보를 확인해주세요.';return}show()}async function signOut(){await sb.auth.signOut();location.reload()}async function show(){login.classList.add('hidden');panel.classList.remove('hidden');const{data:a}=await sb.from('announcements').select('*').order('updated_at',{ascending:false});notices.innerHTML=(a||[]).map(x=>'<div style="padding:10px 0;border-top:1px solid #eee"><b>'+x.title+'</b><div>'+x.body+'</div><button onclick="deleteNotice('+x.id+')">삭제</button></div>').join('');const{data:m}=await sb.from('menu_items').select('*').order('sort_order');menus.innerHTML=(m||[]).map(x=>'<div class="card">'+(x.image_path?'<img class="thumb" src="'+(x.image_path.startsWith("http")?x.image_path:"/"+x.image_path)+'">':'')+'<div class="row"><input id="n'+x.id+'" value="'+x.name+'"><input id="p'+x.id+'" type="number" value="'+x.price+'"></div><input id="f'+x.id+'" type="file" accept="image/jpeg,image/png,image/webp"><button onclick="uploadPhoto('+x.id+')">사진 변경</button><div class="row"><input id="o'+x.id+'" type="number" value="'+x.sort_order+'" placeholder="순서"><button onclick="toggleMenu('+x.id+','+x.is_visible+')">'+(x.is_visible?'메뉴 숨기기':'메뉴 보이기')+'</button></div><button onclick="saveMenu('+x.id+')">메뉴 저장</button><button style="background:#eee" onclick="deleteMenu('+x.id+')">메뉴 삭제</button></div>').join('');const{data:g}=await sb.from('gallery_images').select('*').order('sort_order');galleryAdmin.innerHTML=(g||[]).map(x=>'<div style="padding:10px 0;border-top:1px solid #eee"><img class="thumb" src="'+(x.image_url.startsWith('http')?x.image_url:'/'+x.image_url)+'"><input id="go'+x.id+'" type="number" value="'+x.sort_order+'"><button onclick="saveGalleryOrder('+x.id+')">순서 저장</button><button style="background:#eee" onclick="deleteGallery('+x.id+')">사진 삭제</button></div>').join('');const{data:s}=await sb.from('store_info').select('*').eq('id',1).single();if(s)store.innerHTML='<input id="address" value="'+(s.address||'')+'"><input id="phone" value="'+(s.phone||'')+'"><input id="hours" value="'+(s.hours||'')+'"><input id="nearby" value="'+(s.nearby||'')+'"><input id="parking" value="'+(s.parking||'')+'"><h3>메인 대표사진</h3>'+(s.hero_photo?'<img class="thumb" src="'+s.hero_photo+'">':'')+'<input id="heroFile" type="file" accept="image/jpeg,image/png,image/webp"><button onclick="uploadHero()">메인 대표사진 변경</button><h3>대표자</h3><input id="repName" placeholder="대표자 이름" value="'+(s.representative_name||'')+'>'+(s.representative_photo?'<img class="thumb" src="'+s.representative_photo+'">':'')+'<input id="repFile" type="file" accept="image/jpeg,image/png,image/webp"><button onclick="uploadRepresentative()">대표자 사진 변경</button><button onclick="saveStore()">매장정보 저장</button>'}async function saveNotice(){if(!noticeTitle.value.trim())return alert('제목을 입력해주세요.');const{error}=await sb.from('announcements').insert({title:noticeTitle.value.trim(),body:noticeBody.value.trim()});if(error)return alert('공지 등록 실패');noticeTitle.value='';noticeBody.value='';alert('공지 등록 완료');show()}async function deleteNotice(id){if(!confirm('이 공지를 삭제할까요?'))return;const{error}=await sb.from('announcements').delete().eq('id',id);if(error)return alert('삭제 실패');show()}async function uploadPhoto(id){const file=document.getElementById('f'+id).files[0];if(!file)return alert('사진을 선택해주세요.');const ext=(file.name.split('.').pop()||'jpg').toLowerCase();const path='menu-'+id+'-'+Date.now()+'.'+ext;const{error:u}=await sb.storage.from('menu-images').upload(path,file,{contentType:file.type});if(u)return alert('사진 업로드 실패');const{data}=sb.storage.from('menu-images').getPublicUrl(path);const{error}=await sb.from('menu_items').update({image_path:data.publicUrl,updated_at:new Date().toISOString()}).eq('id',id);if(error)return alert('사진 저장 실패');alert('사진을 변경했습니다.');show()}async function addMenu(){const name=newMenuName.value.trim(),price=+newMenuPrice.value;if(!name||!price)return alert('메뉴명과 가격을 입력해주세요.');const{data:last}=await sb.from('menu_items').select('sort_order').order('sort_order',{ascending:false}).limit(1);const sort=(last&&last[0]?last[0].sort_order:0)+1;const{error}=await sb.from('menu_items').insert({name,price,sort_order:sort,is_visible:true});if(error)return alert('메뉴 추가 실패');newMenuName.value='';newMenuPrice.value='';alert('메뉴를 추가했습니다.');show()}async function toggleMenu(id,current){const{error}=await sb.from('menu_items').update({is_visible:!current,updated_at:new Date().toISOString()}).eq('id',id);if(error)return alert('변경 실패');show()}async function deleteMenu(id){if(!confirm('이 메뉴를 삭제할까요?'))return;const{error}=await sb.from('menu_items').delete().eq('id',id);if(error)return alert('메뉴 삭제 실패');alert('메뉴를 삭제했습니다.');show()}async function saveMenu(id){const{error}=await sb.from('menu_items').update({name:document.getElementById('n'+id).value,price:+document.getElementById('p'+id).value,sort_order:+document.getElementById('o'+id).value,updated_at:new Date().toISOString()}).eq('id',id);alert(error?'저장 권한을 확인해주세요.':'저장했습니다.')}async function addGallery(){const file=galleryFile.files[0];if(!file)return alert('사진을 선택해주세요.');const ext=(file.name.split('.').pop()||'jpg').toLowerCase();const path='gallery-'+Date.now()+'.'+ext;const{error:u}=await sb.storage.from('menu-images').upload(path,file,{contentType:file.type});if(u)return alert('사진 업로드 실패');const{data}=sb.storage.from('menu-images').getPublicUrl(path);const{data:last}=await sb.from('gallery_images').select('sort_order').order('sort_order',{ascending:false}).limit(1);const sort=(last&&last[0]?last[0].sort_order:0)+1;const{error}=await sb.from('gallery_images').insert({image_url:data.publicUrl,alt_text:galleryAlt.value.trim()||'미가네 국밥 매장 사진',sort_order:sort});if(error)return alert('갤러리 저장 실패');galleryFile.value='';galleryAlt.value='';alert('사진을 추가했습니다.');show()}async function saveGalleryOrder(id){const{error}=await sb.from('gallery_images').update({sort_order:+document.getElementById('go'+id).value}).eq('id',id);if(error)return alert('순서 저장 실패');alert('순서를 저장했습니다.');show()}async function deleteGallery(id){if(!confirm('이 사진을 삭제할까요?'))return;const{error}=await sb.from('gallery_images').delete().eq('id',id);if(error)return alert('삭제 실패');show()}async function uploadHero(){const file=heroFile.files[0];if(!file)return alert('메인 사진을 선택해주세요.');const ext=(file.name.split('.').pop()||'jpg').toLowerCase();const path='hero-'+Date.now()+'.'+ext;const{error:u}=await sb.storage.from('menu-images').upload(path,file,{contentType:file.type});if(u)return alert('사진 업로드 실패');const{data}=sb.storage.from('menu-images').getPublicUrl(path);const{error}=await sb.from('store_info').update({hero_photo:data.publicUrl,updated_at:new Date().toISOString()}).eq('id',1);if(error)return alert('사진 저장 실패');alert('메인 대표사진을 변경했습니다.');show()}async function uploadRepresentative(){const file=repFile.files[0];if(!file)return alert('대표자 사진을 선택해주세요.');const ext=(file.name.split('.').pop()||'jpg').toLowerCase();const path='representative-'+Date.now()+'.'+ext;const{error:u}=await sb.storage.from('menu-images').upload(path,file,{contentType:file.type});if(u)return alert('사진 업로드 실패');const{data}=sb.storage.from('menu-images').getPublicUrl(path);const{error}=await sb.from('store_info').update({representative_photo:data.publicUrl,updated_at:new Date().toISOString()}).eq('id',1);if(error)return alert('사진 저장 실패');alert('대표자 사진을 변경했습니다.');show()}async function saveStore(){const{error}=await sb.from('store_info').update({address:address.value,phone:phone.value,hours:hours.value,nearby:nearby.value,parking:parking.value,representative_name:repName.value,updated_at:new Date().toISOString()}).eq('id',1);alert(error?'저장 권한을 확인해주세요.':'저장했습니다.')}sb.auth.getSession().then(({data})=>{if(data.session)show()});</script></body></html>
