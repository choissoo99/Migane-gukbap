<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>미가네 관리자</title><style>body{font-family:system-ui;background:#fffaf0;margin:0;color:#241d16}.wrap{max-width:720px;margin:auto;padding:24px}.card{background:#fff;border:1px solid #eadfce;border-radius:20px;padding:18px;margin-bottom:14px}input,button{box-sizing:border-box;width:100%;padding:13px;margin:6px 0;border:1px solid #ddd;border-radius:12px;font-size:16px}button{background:#f5c542;font-weight:900;border:0}.muted{color:#777}.hidden{display:none}.row{display:grid;grid-template-columns:1fr 120px;gap:8px}</style></head><body><div class="wrap"><h1>미가네 국밥 관리자</h1><div id="login" class="card"><h2>관리자 로그인</h2><input id="email" type="email" placeholder="이메일"><input id="password" type="password" placeholder="비밀번호"><button onclick="signIn()">로그인</button><p id="msg" class="muted">관리자 계정으로 로그인하세요.</p></div><div id="panel" class="hidden"><button onclick="signOut()">로그아웃</button><h2>메뉴 관리</h2><div id="menus"></div><h2>매장 정보</h2><div id="store" class="card"></div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const sb=supabase.createClient('https://dtpynrwuobgwqdrnmtvl.supabase.co','sb_publishable_MzC5d4lPPEeUs9NHPKK0tw_4sGcsbQY');async function signIn(){const{error}=await sb.auth.signInWithPassword({email:email.value,password:password.value});if(error){msg.textContent='로그인 정보를 확인해주세요.';return}show()}async function signOut(){await sb.auth.signOut();location.reload()}async function show(){login.classList.add('hidden');panel.classList.remove('hidden');const{data:m}=await sb.from('menu_items').select('*').order('sort_order');menus.innerHTML=(m||[]).map(x=>'<div class="card"><div class="row"><input id="n'+x.id+'" value="'+x.name+'"><input id="p'+x.id+'" type="number" value="'+x.price+'"></div><button onclick="saveMenu('+x.id+')">저장</button></div>').join('');const{data:s}=await sb.from('store_info').select('*').eq('id',1).single();if(s)store.innerHTML='<input id="address" value="'+(s.address||'')+'"><input id="phone" value="'+(s.phone||'')+'"><input id="hours" value="'+(s.hours||'')+'"><input id="nearby" value="'+(s.nearby||'')+'"><input id="parking" value="'+(s.parking||'')+'"><button onclick="saveStore()">매장정보 저장</button>'}async function saveMenu(id){const{error}=await sb.from('menu_items').update({name:document.getElementById('n'+id).value,price:+document.getElementById('p'+id).value,updated_at:new Date().toISOString()}).eq('id',id);alert(error?'저장 권한을 확인해주세요.':'저장했습니다.')}async function saveStore(){const{error}=await sb.from('store_info').update({address:address.value,phone:phone.value,hours:hours.value,nearby:nearby.value,parking:parking.value,updated_at:new Date().toISOString()}).eq('id',1);alert(error?'저장 권한을 확인해주세요.':'저장했습니다.')}sb.auth.getSession().then(({data})=>{if(data.session)show()});</script></body></html>
